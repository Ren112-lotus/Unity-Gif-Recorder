name: Encoder verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: dotnet run --project Tests~/EncoderSmoke -- TestResults
      - run: python -m pip install Pillow==12.3.0
      - run: python Tests~/verify_encoder.py TestResults
